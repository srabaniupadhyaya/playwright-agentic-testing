name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Create config (needed for type-check)
      run: cp config/config.example.json config/config.json
    - name: Type-check
      run: npx tsc --noEmit
    - name: Lint
      run: npm run lint
    - name: Format check
      run: npm run format:check
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Create config
      env:
        DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
        DEMO_APP_PATH: ${{ vars.DEMO_APP_PATH }}
        DEMO_USERNAME: ${{ vars.DEMO_USERNAME }}
        DEMO_PASSWORD: ${{ vars.DEMO_PASSWORD }}
      run: |
        cat > config/config.json <<EOF
        {
          "environment": "ci",
          "baseUrl": "${DEMO_BASE_URL}",
          "demoAppPath": "${DEMO_APP_PATH}",
          "credentials": {
            "username": "${DEMO_USERNAME}",
            "password": "${DEMO_PASSWORD}"
          },
          "timeouts": {
            "defaultTimeout": 30000,
            "navigationTimeout": 30000,
            "actionTimeout": 15000
          },
          "headless": true
        }
        EOF
    - name: Run Playwright tests
      run: npm run test:ci
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
